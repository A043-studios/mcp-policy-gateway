name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest "mcp>=2"
      - run: pytest -v
      - run: python demo/run_demo.py
      - run: python demo/ablation.py
      - run: PYTHONPATH=src python -m mcpgate review --policy gateway.toml
